<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Blitz - GitHub Edition</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Libreria PeerJS per Multiplayer P2P -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Pannello Connessione Multiplayer -->
  <div id="multiplayer-panel" style="background: #202024; padding: 15px; margin-bottom: 20px; border-radius: 8px; text-align: center;">
    <button id="btn-create" onclick="createRoom()" style="padding: 8px 12px; cursor: pointer;">Crea Partita (Host)</button>
    <input type="text" id="room-code-input" placeholder="Codice Stanza..." style="padding: 8px; width: 150px; text-align: center;">
    <button id="btn-join" onclick="joinRoom()" style="padding: 8px 12px; cursor: pointer;">Unisciti</button>
    <p id="connection-status" style="margin-top: 10px; color: #f39c12; font-weight: bold;"></p>
  </div>

  <header>
    <h1>⚡ WORD BLITZ ⚡</h1>
    <div id="status-bar">
      <span>I tuoi fulmini: <strong id="player-lightnings">0</strong> / 40</span>
      <span id="opponent-status-container">Fulmini Amico: <strong id="bot-lightnings">0</strong> / 40</span>
    </div>
  </header>

  <main>
    <!-- Tavolo: Carta Domanda Corrente -->
    <section class="board">
      <div class="question-card">
        <span class="label">CATEGORIA ATTIVA</span>
        <h2 id="current-category">Caricamento...</h2>
        <div class="progress">Parole giocate: <span id="words-count">0</span> / 3</div>
      </div>

      <!-- Elenco parole lanciate in questo round -->
      <div id="played-words" class="played-words"></div>
    </section>

    <!-- Mano di Carte e Input con Microfono + Tasto INVIA -->
    <section class="player-area">
      <h3>LA TUA MANO</h3>
      <div id="player-hand" class="hand"></div>

      <!-- Input unificato con Tasto Invia e Microfono -->
      <div class="input-area" style="display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 10px;">
        <input 
          type="text" 
          id="word-input" 
          placeholder="Scrivi una parola..." 
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="characters" 
          spellcheck="false"
          style="flex: 1; max-width: 240px; padding: 12px; border-radius: 20px;"
        >
        <button onclick="submitTypedWord()" style="background: #27ae60; color: white; border: none; padding: 12px 18px; border-radius: 20px; font-weight: bold; cursor: pointer;">INVIA</button>
        <button id="btn-mic" onclick="startVoiceRecognition()" style="background: #e74c3c; color: white; border: none; padding: 12px 15px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;" title="Comando vocale">🎙️</button>
      </div>
      <span id="error-msg" class="error-msg"></span>
    </section>
  </main>

  <!-- Ordine di caricamento script -->
  <script src="js/dictionary.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/network.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
