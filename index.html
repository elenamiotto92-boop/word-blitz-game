<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Blitz - GitHub Edition</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Libreria PeerJS per Multiplayer P2P -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<!-- Pannello Connessione Multiplayer -->
<div id="multiplayer-panel" style="background: #202024; padding: 15px; margin-bottom: 20px; border-radius: 8px;">
  <button id="btn-create" onclick="createRoom()">Crea Partita (Host)</button>
  <input type="text" id="room-code-input" placeholder="Codice Stanza..." style="padding: 8px; width: 150px;">
  <button id="btn-join" onclick="joinRoom()">Unisciti</button>
  <p id="connection-status" style="margin-top: 10px; color: #f39c12; font-weight: bold;"></p>
</div>
  <header>
    <h1>⚡ WORD BLITZ ⚡</h1>
    <div id="status-bar">
      <span>I tuoi fulmini: <strong id="player-lightnings">0</strong> / 40</span>
      <span>Fulmini Bot: <strong id="bot-lightnings">0</strong> / 40</span>
    </div>
  </header>

  <main>
    <!-- Tavolo: Carta Domanda Corrente -->
    <section class="board">
      <div class="question-card">
        <span class="label">CATEGORIA ATTIVA</span>
        <h2 id="current-category">Caricamento...</h2>
        <div class="progress">Parole giocate: <span id="words-count">0</span> / 3</div>
      </div>

      <!-- Elenco parole lanciate in questo round -->
      <div id="played-words" class="played-words"></div>
    </section>

    <!-- Mano di Carte e Input Veloce -->
    <section class="player-area">
      <h3>LA TUA MANO</h3>
      <div id="player-hand" class="hand"></div>

      <!-- Input veloce per digitare la parola -->
      <div class="input-area">
        <input 
          type="text" 
          id="word-input" 
          placeholder="Scrivi una parola rapida e premi INVIO..." 
          autocomplete="off" 
          autofocus
        >
        <span id="error-msg" class="error-msg"></span>
      </div>
    </section>
  </main>

  <!-- Ordine di caricamento degli script (fondamentale) -->
  <script src="js/dictionary.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
